name: Build Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Export Android arm64 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Download Godot 4.3 and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O export-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q export-templates.tpz -d export-templates
          cp -a export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/ApexRacing-debug.apk
          test -s build/ApexRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Racing-Android-Debug
          path: build/ApexRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
